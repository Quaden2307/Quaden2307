<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Caden Sun — Mathematics @ University of Waterloo">
  <style>
    .tw{animation:tw 3.2s ease-in-out infinite}
    .d1{animation-delay:-.4s}
    .d2{animation-delay:-1.1s;animation-duration:2.5s}
    .d3{animation-delay:-1.9s;animation-duration:4.2s}
    .d4{animation-delay:-2.6s;animation-duration:3.6s}
    .d5{animation-delay:-3.1s;animation-duration:4.8s}
    .d6{animation-delay:-.8s;animation-duration:2.9s}
    @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
    .a1{animation:aa 26s ease-in-out infinite alternate;animation-delay:-13s}
    .a2{animation:ab 32s ease-in-out infinite alternate;animation-delay:-21s}
    .a3{animation:ac 38s ease-in-out infinite alternate;animation-delay:-9s}
    @keyframes aa{to{transform:translate(90px,40px)}}
    @keyframes ab{to{transform:translate(-80px,-30px)}}
    @keyframes ac{to{transform:translate(60px,-40px)}}
    .shoot{animation:sh 7s linear infinite;animation-delay:-5.2s}
    .f2{animation-duration:9s;animation-delay:-6.1s}
    .f3{animation-duration:8s;animation-delay:-3.9s}
    .f4{animation-duration:10s;animation-delay:-4.5s}
    .f5{animation-duration:6.5s;animation-delay:-.9s}
    @keyframes sh{0%,80%{transform:translate(0,0);opacity:0}83%{opacity:1}92%,100%{transform:translate(-340px,186px);opacity:0}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <defs>
    <radialGradient id="gblue"><stop offset="0" stop-color="#3b82f6" stop-opacity=".16"/><stop offset=".65" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gindigo"><stop offset="0" stop-color="#6366f1" stop-opacity=".12"/><stop offset=".65" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="gcyan"><stop offset="0" stop-color="#22d3ee" stop-opacity=".09"/><stop offset=".65" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="tail" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="110" y2="-58">
      <stop offset="0" stop-color="#ededed" stop-opacity=".9"/><stop offset="1" stop-color="#ededed" stop-opacity="0"/>
    </linearGradient>
    <circle id="s1" r=".9" fill="#ededed"/>
    <circle id="s2" r="1.4" fill="#ededed"/>
    <circle id="s3" r=".7" fill="#60a5fa"/>
    <circle id="s4" r="1.7" fill="#ededed"/>
    <circle id="s5" r="1.1" fill="#93c5fd"/>
  </defs>

  <rect width="1200" height="300" fill="#0a0a0a"/>

  <!-- aurora: same hues and drift durations as the site -->
  <ellipse class="a1" cx="190" cy="30" rx="380" ry="220" fill="url(#gblue)"/>
  <ellipse class="a2" cx="1030" cy="280" rx="360" ry="210" fill="url(#gindigo)"/>
  <ellipse class="a3" cx="760" cy="90" rx="260" ry="160" fill="url(#gcyan)"/>

  <!-- starfield -->
  <g>
    <use xlink:href="#s1" x="42"   y="38"  class="tw d1"/>
    <use xlink:href="#s2" x="118"  y="86"  class="tw d4"/>
    <use xlink:href="#s3" x="83"   y="187" class="tw d2"/>
    <use xlink:href="#s1" x="151"  y="243" class="tw d5"/>
    <use xlink:href="#s5" x="204"  y="55"  class="tw d3"/>
    <use xlink:href="#s1" x="242"  y="140" class="tw d6"/>
    <use xlink:href="#s4" x="288"  y="34"  class="tw d2"/>
    <use xlink:href="#s1" x="311"  y="212" class="tw d1"/>
    <use xlink:href="#s3" x="352"  y="92"  class="tw d5"/>
    <use xlink:href="#s1" x="396"  y="266" class="tw d3"/>
    <use xlink:href="#s2" x="428"  y="47"  class="tw d6"/>
    <use xlink:href="#s1" x="459"  y="158" class="tw d4"/>
    <use xlink:href="#s5" x="497"  y="235" class="tw d1"/>
    <use xlink:href="#s1" x="521"  y="76"  class="tw d2"/>
    <use xlink:href="#s3" x="568"  y="41"  class="tw d5"/>
    <use xlink:href="#s1" x="591"  y="262" class="tw d6"/>
    <use xlink:href="#s2" x="637"  y="97"  class="tw d3"/>
    <use xlink:href="#s1" x="668"  y="223" class="tw d1"/>
    <use xlink:href="#s4" x="705"  y="52"  class="tw d4"/>
    <use xlink:href="#s1" x="742"  y="176" class="tw d2"/>
    <use xlink:href="#s3" x="781"  y="248" class="tw d6"/>
    <use xlink:href="#s1" x="815"  y="88"  class="tw d5"/>
    <use xlink:href="#s5" x="852"  y="31"  class="tw d1"/>
    <use xlink:href="#s1" x="887"  y="204" class="tw d3"/>
    <use xlink:href="#s2" x="923"  y="121" class="tw d2"/>
    <use xlink:href="#s1" x="958"  y="259" class="tw d4"/>
    <use xlink:href="#s3" x="994"  y="66"  class="tw d6"/>
    <use xlink:href="#s1" x="1033" y="171" class="tw d1"/>
    <use xlink:href="#s4" x="1067" y="39"  class="tw d5"/>
    <use xlink:href="#s1" x="1101" y="238" class="tw d2"/>
    <use xlink:href="#s5" x="1138" y="104" class="tw d3"/>
    <use xlink:href="#s1" x="1166" y="52"  class="tw d6"/>
    <use xlink:href="#s2" x="1184" y="196" class="tw d1"/>
    <use xlink:href="#s1" x="67"   y="118" class="tw d3"/>
    <use xlink:href="#s3" x="178"  y="281" class="tw d4"/>
    <use xlink:href="#s1" x="264"  y="74"  class="tw d5"/>
    <use xlink:href="#s1" x="341"  y="33"  class="tw d2"/>
    <use xlink:href="#s5" x="415"  y="199" class="tw d6"/>
    <use xlink:href="#s1" x="489"  y="29"  class="tw d1"/>
    <use xlink:href="#s3" x="547"  y="277" class="tw d3"/>
    <use xlink:href="#s1" x="615"  y="36"  class="tw d5"/>
    <use xlink:href="#s2" x="689"  y="284" class="tw d2"/>
    <use xlink:href="#s1" x="758"  y="30"  class="tw d6"/>
    <use xlink:href="#s3" x="836"  y="270" class="tw d4"/>
    <use xlink:href="#s1" x="905"  y="44"  class="tw d1"/>
    <use xlink:href="#s5" x="971"  y="185" class="tw d5"/>
    <use xlink:href="#s1" x="1049" y="272" class="tw d3"/>
    <use xlink:href="#s2" x="1121" y="29"  class="tw d6"/>
    <use xlink:href="#s1" x="27"   y="222" class="tw d2"/>
    <use xlink:href="#s3" x="219"  y="102" class="tw d1"/>
    <use xlink:href="#s1" x="374"  y="131" class="tw d4"/>
    <use xlink:href="#s1" x="641"  y="187" class="tw d5"/>
    <use xlink:href="#s1" x="869"  y="140" class="tw d6"/>
    <use xlink:href="#s3" x="1090" y="143" class="tw d2"/>
  </g>

  <!-- shooting stars -->
  <g transform="translate(1010,42)">
    <g class="shoot">
      <line x1="0" y1="0" x2="110" y2="-58" stroke="url(#tail)" stroke-width="2" stroke-linecap="round"/>
      <circle r="1.8" fill="#ededed"/>
    </g>
  </g>
  <g transform="translate(560,26)">
    <g class="shoot f2">
      <line x1="0" y1="0" x2="110" y2="-58" stroke="url(#tail)" stroke-width="2" stroke-linecap="round"/>
      <circle r="1.8" fill="#ededed"/>
    </g>
  </g>
  <g transform="translate(1160,110)">
    <g class="shoot f3">
      <line x1="0" y1="0" x2="110" y2="-58" stroke="url(#tail)" stroke-width="2" stroke-linecap="round"/>
      <circle r="1.8" fill="#ededed"/>
    </g>
  </g>
  <g transform="translate(820,64)">
    <g class="shoot f4">
      <line x1="0" y1="0" x2="110" y2="-58" stroke="url(#tail)" stroke-width="2" stroke-linecap="round"/>
      <circle r="1.8" fill="#ededed"/>
    </g>
  </g>
  <g transform="translate(300,20)">
    <g class="shoot f5">
      <line x1="0" y1="0" x2="110" y2="-58" stroke="url(#tail)" stroke-width="2" stroke-linecap="round"/>
      <circle r="1.8" fill="#ededed"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="600" y="160" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="52" font-weight="600" letter-spacing="1" fill="#ededed">Caden Sun<tspan class="cur" fill="#3b82f6">▊</tspan></text>
  <text x="600" y="200" text-anchor="middle" font-family="Geist,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" fill="#a3a3a3">Mathematics @ University of Waterloo</text>
</svg>
