name: Update Contribution Stats

# Recomputes "Total Contributions" (all time) and "Contributions in the last
# 30 days" from the public contributions calendar, then renders them into the
# ring graphic at assets/contributions-ring.svg (which the README displays).
on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compute contribution numbers
        run: |
          USER=Quaden2307
          API="https://github-contributions-api.jogruber.de/v4/$USER"
          ALL=$(curl -fsS "$API" | jq '[.total[]] | add') || ALL=""
          L30=$(curl -fsS "$API?y=last" | jq '[.contributions[-30:][].count] | add') || L30=""
          echo "Computed ALL='$ALL'  L30='$L30'"
          if [[ "$ALL" =~ ^[0-9]+$ && "$L30" =~ ^[0-9]+$ ]]; then
            echo "ALL=$ALL" >> "$GITHUB_ENV"
            echo "L30=$L30" >> "$GITHUB_ENV"
          else
            echo "API returned no valid data; leaving the ring unchanged."
          fi

      - name: Render contribution ring
        if: env.ALL != ''
        run: |
          sed -e "s/__ALL__/${ALL}/g" -e "s/__L30__/${L30}/g" \
            assets/contributions-ring.template.svg > assets/contributions-ring.svg

      - name: Render contribution calendar
        run: |
          curl -fsS "https://github-contributions-api.jogruber.de/v4/Quaden2307?y=last" > "$RUNNER_TEMP/contrib.json" \
            && python3 scripts/render_contribution_calendar.py "$RUNNER_TEMP/contrib.json" assets/contributions-calendar.svg \
            || echo "Calendar API returned no valid data; leaving the calendar unchanged."

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-ring.svg assets/contributions-calendar.svg
          if git diff --cached --quiet; then
            echo "Contribution graphics unchanged."
          else
            git commit -m "chore: update contribution graphics [skip ci]"
            git push
          fi
