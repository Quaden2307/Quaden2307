name: Update Contribution Stats

# Recomputes "Total Contributions" (all time) and "Contributions in the last
# 30 days" from the public contributions calendar, then writes the numbers into
# the two badges in README.md (between the CONTRIB:START / CONTRIB:END markers).
on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compute contribution numbers
        run: |
          USER=Quaden2307
          API="https://github-contributions-api.jogruber.de/v4/$USER"
          ALL=$(curl -fsS "$API" | jq '[.total[]] | add') || ALL=""
          L30=$(curl -fsS "$API?y=last" | jq '[.contributions[-30:][].count] | add') || L30=""
          echo "Computed ALL='$ALL'  L30='$L30'"
          if [[ "$ALL" =~ ^[0-9]+$ && "$L30" =~ ^[0-9]+$ ]]; then
            echo "ALL=$ALL" >> "$GITHUB_ENV"
            echo "L30=$L30" >> "$GITHUB_ENV"
          else
            echo "API returned no valid data; leaving README unchanged."
          fi

      - name: Inject numbers into README
        if: env.ALL != ''
        run: |
          perl -0777 -i -pe '
            my $r = "<!-- CONTRIB:START -->\n".
              "<img alt=\"Total Contributions\" src=\"https://img.shields.io/badge/Total_Contributions-$ENV{ALL}-cba6f7?style=for-the-badge&labelColor=181825&logo=github&logoColor=white\" />\n".
              "<img alt=\"Last 30 Days\" src=\"https://img.shields.io/badge/Contributions_(Last_30_Days)-$ENV{L30}-fab387?style=for-the-badge&labelColor=181825&logo=githubactions&logoColor=white\" />\n".
              "<!-- CONTRIB:END -->";
            s{<!-- CONTRIB:START -->.*?<!-- CONTRIB:END -->}{$r}s;
          ' README.md

      - name: Commit & push if changed
        if: env.ALL != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Contribution numbers unchanged."
          else
            git commit -m "chore: update contribution stats [skip ci]"
            git push
          fi
