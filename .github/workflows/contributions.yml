name: Update contribution graph

# Redraws assets/contributions-*.svg (the graph under the name in the README)
# from the last year of public contribution data, once a day.
on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Render the contribution graph
        run: |
          if curl -fsS "https://github-contributions-api.jogruber.de/v4/${{ github.repository_owner }}?y=last" \
              -o "$RUNNER_TEMP/contributions.json"; then
            python3 scripts/contributions.py "$RUNNER_TEMP/contributions.json" assets
          else
            echo "Contribution data unavailable; keeping the current graph."
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-light.svg assets/contributions-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution graph unchanged."
          else
            git commit -m "chore: update contribution graph [skip ci]"
            git pull --rebase origin main
            git push
          fi
